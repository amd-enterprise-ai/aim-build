      hfToken:
        required: false
      release:
        notes: ""
      description:
        full: "A DeepEdit interactive 3D segmentation model trained on the Medical Segmentation Decathlon Task09 Spleen dataset. Combines automatic segmentation with point-prompt-guided interactive correction: alongside the CT image, the network accepts two extra input channels encoding user-supplied foreground (spleen) and background click maps. Inputs are resized to 128x128x128, processed once by a DynUNet, then inverted back to the original space. Reported mean Dice on the validation split is 0.97 (with simulated clicks; automatic-mode scores lower, ~0.835 zero-click anchor)."
      title: "Spleen DeepEdit Interactive Segmentation"
