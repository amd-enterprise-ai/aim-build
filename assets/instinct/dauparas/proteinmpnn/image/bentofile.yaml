# BentoML build/serve manifest for ProteinMPNN.
#
# `bentoml serve --working-dir /workspace/model` reads the `service` field
# below to locate the service instance. The `service` module resolves from
# /workspace/model/src, which the specialized Dockerfile places on sys.path
# via a .pth file.
service: "service:ProteinMPNNService"

include:
  - "src/*.py"
