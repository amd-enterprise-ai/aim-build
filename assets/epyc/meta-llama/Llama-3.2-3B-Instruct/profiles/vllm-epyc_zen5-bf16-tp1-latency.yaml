  ZENDNNL_MATMUL_ALGO: '1'
  ZENDNNL_MATMUL_WEIGHT_CACHE: '1'
  ZENDNN_PRIMITIVE_CACHE_CAPACITY: '1024'
  ZENDNN_TENSOR_POOL_LIMIT: '1024'
  ZENDNN_WEIGHT_CACHING: '1'
