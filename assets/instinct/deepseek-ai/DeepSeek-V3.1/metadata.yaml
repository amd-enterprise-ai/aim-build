com:
  amd:
    aim:
      description:
        full: "DeepSeek-V3.1 is a 671 billion total parameter mixture-of-experts (MoE) language model from DeepSeek AI, with 37 billion active parameters. It is a hybrid model supporting both thinking mode (for extended reasoning) and non-thinking mode (for standard dialogue). Post-trained on top of DeepSeek-V3.1-Base with expanded long-context training (630B tokens for 32K extension, 209B tokens for 128K extension). The model features tool calling with code agent and search agent capabilities, and uses UE8M0 FP8 scale data format on both weights and activations. Licensed under MIT."
      hfToken:
        required: false
      model:
        canonicalName: "deepseek-ai/DeepSeek-V3.1"
        publisher: "DeepSeek"
        recommendedDeployments:
        - gpuModel: "MI300X"
          gpuCount: 8
          precision: "fp8"
          metric: "latency"
          description: "Optimized for latency on MI300X using fp8 precision"
        - gpuModel: "MI300X"
          gpuCount: 8
          precision: "fp8"
          metric: "throughput"
          description: "Optimized for throughput on MI300X using fp8 precision"
        - gpuModel: "MI325X"
          gpuCount: 8
          metric: "latency"
          description: "Optimized for latency on MI325X using fp8 precision"
          profileId: "vllm-mi325x-fp8-tp8-latency"
        - gpuModel: "MI325X"
          gpuCount: 8
          metric: "throughput"
          description: "Optimized for throughput on MI325X using fp8 precision"
          profileId: "vllm-mi325x-fp8-tp8-throughput"
        - gpuModel: "MI350X"
          gpuCount: 8
          precision: "fp8"
          metric: "latency"
          description: "Optimized for latency on MI350X using fp8 precision"
        - gpuModel: "MI350X"
          gpuCount: 8
          precision: "fp8"
          metric: "throughput"
          description: "Optimized for throughput on MI350X using fp8 precision"
        - gpuModel: "MI355X"
          gpuCount: 8
          precision: "fp8"
          metric: "latency"
          description: "Optimized for latency on MI355X using fp8 precision"
        - gpuModel: "MI355X"
          gpuCount: 8
          precision: "fp8"
          metric: "throughput"
          description: "Optimized for throughput on MI355X using fp8 precision"
        source: "https://huggingface.co/deepseek-ai/DeepSeek-V3.1"
        tags:
        - "text-generation"
        - "chat"
        variants:
        - "deepseek-ai/DeepSeek-V3.1"
