aim_id: deepseek-ai/DeepSeek-R1-0528
model_id: deepseek-ai/DeepSeek-R1-0528
metadata:
  engine: vllm
  gpu: MI355X
  gpu_count: 8
  manual_selection_only: false
  metric: throughput
  precision: fp8
  type: optimized
engine_args:
  block-size: 1
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  kv-cache-dtype: fp8
  max-model-len: 32768
  max-num-batched-tokens: 8192
  max-num-seqs: 1024
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  reasoning-parser: deepseek_r1
  swap-space: 64
  tensor-parallel-size: 8
  tool-call-parser: deepseek_v3
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
