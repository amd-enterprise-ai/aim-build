aim_id: meta-llama/Llama-3.3-70B-Instruct
model_id: meta-llama/Llama-3.3-70B-Instruct
metadata:
  engine: vllm
  gpu: MI325X
  gpu_count: 2
  manual_selection_only: true
  metric: throughput
  precision: fp16
  type: unoptimized
engine_args:
  disable-uvicorn-access-log: null
  dtype: float16
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  max-model-len: 32768
  max-num-batched-tokens: 8192
  max-num-seqs: 512
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  swap-space: 64
  tensor-parallel-size: 2
  tool-call-parser: llama3_json
env_vars:
  HSA_NO_SCRATCH_RECLAIM: '1'
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_RMSNORM: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
