[pytest]
addopts = -m "not gpu and not engine"
markers =
    gpu: requires a GPU node and the built image (skipped in the CPU pre-gate)
    engine: needs the engine of the image (torch, boltz, bentoml) but no GPU; unit-tests.yaml runs it inside the base image
