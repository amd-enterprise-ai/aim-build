aim_id: meta-llama/Llama-3.1-405B-Instruct
model_id: amd/Llama-3.1-405B-Instruct-FP8-KV
metadata:
  engine: vllm
  gpu: MI325X
  gpu_count: 4
  manual_selection_only: true
  metric: latency
  precision: fp8
  type: unoptimized
engine_args:
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  dtype: float16
  gpu-memory-utilization: 0.9
  kv-cache-dtype: fp8
  max-model-len: 32768
  max-num-batched-tokens: 1024
  max-num-seqs: 512
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  swap-space: 64
  tensor-parallel-size: 4
env_vars:
  HSA_NO_SCRATCH_RECLAIM: '1'
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_RMSNORM: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
