aim_id: mistralai/Mistral-Small-24B-Instruct-2501
model_id: mistralai/Mistral-Small-24B-Instruct-2501
metadata:
  accelerator_count: 1
  accelerator_model: MI325X
  accelerator_type: gpu
  engine: vllm
  features:
  - adapters
  gpu: MI325X
  gpu_count: 1
  manual_selection_only: true
  metric: latency
  precision: bf16
  primary: true
  type: unoptimized
engine_args:
  async-scheduling: null
  config-format: mistral
  disable-uvicorn-access-log: null
  dtype: bfloat16
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  load-format: mistral
  max-model-len: 32768
  max-num-batched-tokens: 1024
  max-num-seqs: 512
  no-enable-log-requests: null
  no-trust-remote-code: null
  tensor-parallel-size: 1
  tokenizer-mode: mistral
  tool-call-parser: mistral
env_vars:
  HSA_NO_SCRATCH_RECLAIM: '1'
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
