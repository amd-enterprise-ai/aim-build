      description:
        full: "Mistral-Large-3-675B-Instruct-2512 is a 675 billion total parameter granular mixture-of-experts (MoE) multimodal language model from Mistral AI, with 41 billion active parameters. It consists of a 673B parameter (39B active) language model and a 2.5B vision encoder. The model is the instruct post-trained version in FP8 precision. It supports text and vision inputs, native function calling with JSON output, and handles 11 languages including English, French, Spanish, German, Italian, Portuguese, Dutch, Chinese, Japanese, Korean, and Arabic. It provides a 256K token context window. Designed for long document understanding, AI assistants, agentic tool use, and enterprise knowledge work. Licensed under Apache 2.0."
