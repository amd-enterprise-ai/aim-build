org:
  opencontainers:
    image:
      vendor: "AMD"
      authors: ""
      licenses: "apache-2.0, MIT"
      description: "Gemma 4 31B IT is a multimodal instruction-tuned model with text and image input, 256K native context, and Gemma 4 reasoning + tool-call parsers."
      documentation: ""
      source: "https://github.com/amd-enterprise-ai/aim-build"
com:
  amd:
    aim:
      model:
        canonicalName: "google/gemma-4-31B-it"
        tags:
        - "text-generation"
        - "image-text-to-text"
        - "chat"
        - "instruction"
        - "reasoning"
        - "multimodal"
        source: "https://huggingface.co/google/gemma-4-31B-it"
        variants:
        - "google/gemma-4-31B-it"
        recommendedDeployments:
        - gpuModel: "MI300X"
          gpuCount: 1
          precision: "bf16"
          metric: "latency"
          description: "Optimized for latency on MI300X using bf16 precision"
        - gpuModel: "MI300X"
          gpuCount: 1
          precision: "bf16"
          metric: "throughput"
          description: "Optimized for throughput on MI300X using bf16 precision"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "latency"
          description: "Optimized for latency on MI325X using bf16 precision"
          profileId: "vllm-mi325x-bf16-tp1-latency"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "throughput"
          description: "Optimized for throughput on MI325X using bf16 precision"
          profileId: "vllm-mi325x-bf16-tp1-throughput"
        - gpuModel: "MI350X"
          gpuCount: 1
          precision: "bf16"
          metric: "latency"
          description: "Optimized for latency on MI350X using bf16 precision"
        - gpuModel: "MI350X"
          gpuCount: 1
          precision: "bf16"
          metric: "throughput"
          description: "Optimized for throughput on MI350X using bf16 precision"
        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "bf16"
          metric: "latency"
          description: "Optimized for latency on MI355X using bf16 precision"
        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "bf16"
          metric: "throughput"
          description: "Optimized for throughput on MI355X using bf16 precision"
        publisher: "Google"
      hfToken:
        required: false
      release:
        notes: ""
      description:
        full: "Gemma 4 31B IT is the instruction-tuned variant of Google's Gemma 4 31B (Gemma4ForConditionalGeneration). It is a dense (non-MoE) 60-layer model with a heterogeneous attention topology (head_dim 256, global_head_dim 512), sliding-window attention interleaved with periodic full-attention layers, 256K native max_position_embeddings, and a SigLIP-based vision encoder for image inputs. vLLM 0.19+ auto-selects the TRITON_ATTN backend for this architecture."
      title: "Gemma 4 31B IT"
