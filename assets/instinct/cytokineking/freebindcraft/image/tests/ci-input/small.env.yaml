# Run-to-completion check, case "small": check-only mode. The image validates the settings (small/settings.json:
# 1PGB chain A target, 31-45 residue binder), the target and GPU visibility, writes bindcraft.log and summary.json
# under AIM_OUTPUT_PATH and exits 0 without designing anything. It needs no AlphaFold2 parameters, which a CI
# runner does not have, and finishes in seconds.
AIM_FBC_PREFLIGHT_ONLY: "1"
