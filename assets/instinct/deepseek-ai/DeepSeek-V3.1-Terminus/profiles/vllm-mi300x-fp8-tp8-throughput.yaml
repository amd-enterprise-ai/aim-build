aim_id: deepseek-ai/DeepSeek-V3.1-Terminus
model_id: deepseek-ai/DeepSeek-V3.1-Terminus
metadata:
  accelerator_count: 8
  accelerator_model: MI300X
  accelerator_type: gpu
  engine: vllm
  gpu: MI300X
  gpu_count: 8
  manual_selection_only: false
  metric: throughput
  precision: fp8
  primary: true
  type: optimized
engine_args:
  block-size: 1
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  max-model-len: 32768
  max-num-batched-tokens: 8192
  max-num-seqs: 1024
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  reasoning-parser: deepseek_v3
  swap-space: 64
  tensor-parallel-size: 8
  tool-call-parser: deepseek_v31
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_TRITON_ROPE: '1'
