      hfToken:
        required: true
      release:
        notes: ""
      description:
        full: "Llama 3.3 70B Instruct is a multilingual large language model from Meta with 70 billion parameters. It is an auto-regressive language model using an optimized transformer architecture with Grouped-Query Attention (GQA). The instruction-tuned version uses supervised fine-tuning (SFT) and reinforcement learning with human feedback (RLHF) to align with human preferences for helpfulness and safety. The model supports multilingual dialogue across 8 languages (English, German, French, Italian, Portuguese, Hindi, Spanish, and Thai). Pre-trained on over 15 trillion tokens of publicly available data with a knowledge cutoff of December 2023. Intended for assistant-like chat, with support for tool use, synthetic data generation, and model distillation."
      title: "Llama 3.3 70B Instruct"
