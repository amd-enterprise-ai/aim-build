# Global exclude pattern applies to all hooks
exclude: \.patch$|^LICENSE

repos:
- repo: local
  hooks:
  - id: copyright-check
    name: AMD Copyright Check
    description: Check that all files have the required AMD copyright
    entry: src/aim_utils/check_copyright.py
    language: python
    pass_filenames: true
    always_run: false

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-json
  - id: check-yaml
    exclude: ".*_template\\.yaml$"
  - id: end-of-file-fixer
    exclude: "^docs/docs-aim/.*\\.md$|^docs/templates/.*$"
  - id: check-toml
  - id: trailing-whitespace
    exclude: "^docs/docs-aim/.*\\.md$|^docs/templates/.*$"

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: v4.0.0-alpha.8
  hooks:
  - id: prettier
    files: ^\.github/.*\.ya?ml$
    types: [ yaml ]

- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.35.1
  hooks:
  - id: yamllint
    files: ^\.github/.*\.ya?ml$
    args: [ --strict, -c=.yamllint ]

- repo: https://github.com/psf/black
  rev: 25.1.0
  hooks:
  - id: black
    language_version: python3.12
    args: [ "--config=pyproject.toml" ]

- repo: https://github.com/pycqa/flake8
  rev: 7.1.2
  hooks:
  - id: flake8
    args: [ "--config=.flake8" ]

- repo: https://github.com/pycqa/isort
  rev: 6.0.0
  hooks:
  - id: isort
    name: isort (python)
    args: [ "--settings-path=pyproject.toml" ]

- repo: https://github.com/PyCQA/autoflake
  rev: v2.3.1
  hooks:
  - id: autoflake
    args:
    - --in-place
    - --remove-all-unused-imports
    - --remove-unused-variables
    - --ignore-init-module-imports

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.15.0
  hooks:
  - id: mypy
    args: [ "--config-file=pyproject.toml" ]
    exclude: ^(tests/|docker/)
    language_version: python3.12
    additional_dependencies:
    - types-PyYAML
    - types-requests

- repo: local
  hooks:
  - id: pytest
    name: pytest
    # Harness unit tests live beside the harness they cover, in
    # assets/<acc>/<org>/<model>/image/tests/, so they are discovered rather
    # than listed. Keep in sync with the "Run unit tests" step in
    # .github/workflows/fast-feedback.yaml, which discovers the same directories.
    entry: bash -c 'python3 -m pytest tests/ $(find assets -type d -path "*/image/tests") -v'
    language: system
    types: [ python ]
    pass_filenames: false
    always_run: true

- repo: local
  hooks:
  - id: yaml-key-order
    name: "Profiles: sort keys in YAMLs"
    description: Sort non-top-level keys in profile YAML files alphabetically
    entry: python3 -m aim_utils.profile_utils sort-profile-keys
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/[^/]+/.*/profiles/.*\.yaml$

- repo: local
  hooks:
  - id: check-profile-names
    name: "Profiles: check names"
    description: Check if profile metadata matches profile's file name
    entry: python3 -m aim_utils.profile_utils check-all-metadata
    language: system
    types: [ yaml ]
    pass_filenames: false
    always_run: false
    files: ^assets/[^/]+/.*/profiles/.*\.yaml$

- repo: local
  hooks:
  - id: metadata-validation
    name: "Metadata: validation"
    description: Validate metadata YAML files
    entry: python3 -m aim_utils.metadata_utils validate-files
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/[^/]+/.*/metadata\.yaml$

- repo: local
  hooks:
  - id: validate-config
    name: "Config: validate registry and version"
    description: Validate config.yaml files against AIM versioning and registry conventions
    entry: python3 -m aim_utils.config_utils validate
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/.*/config\.yaml$

- repo: local
  hooks:
  - id: set-all-primary-flags
    name: "Profiles: set primary flags"
    description: Set profiles recommended for deployment as primary
    entry: python3 -m aim_utils.profile_utils set-all-primary-flags
    language: system
    types: [ yaml ]
    pass_filenames: false
    always_run: false
    files: ^assets/[^/]+/.*/profiles/.*\.yaml$

- repo: local
  hooks:
  - id: check-canonical-name
    name: "Metadata: canonicalName matches asset path"
    description: Reject model canonical names that differ from <org>/<model>
    entry: python3 -m aim_utils.asset_lint check-canonical-name
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/[^/]+/[^/]+/[^/]+/metadata\.yaml$

- repo: local
  hooks:
  - id: check-placeholders
    name: "Assets: check for template placeholders"
    description: Reject unsubstituted scaffolding markers left in assets
    entry: python3 -m aim_utils.asset_lint check-placeholders
    language: system
    pass_filenames: true
    always_run: false
    files: ^assets/.*\.(yaml|yml|py|toml|txt|md|json)$

- repo: local
  hooks:
  - id: check-internal-comments
    name: "Assets: check for internal comments"
    description: Reject agent narration and ticket references in published asset YAML
    entry: python3 -m aim_utils.asset_lint check-internal-comments
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/.*\.(yaml|yml)$

- repo: local
  hooks:
  - id: check-internal-comments-py
    name: "Assets: check for internal comments in Python source"
    description: Reject Jira ticket IDs and agent narration in comments in specialized image Python files
    entry: python3 -m aim_utils.asset_lint check-internal-comments
    language: system
    types: [ python ]
    pass_filenames: true
    always_run: false
    files: ^assets/.*/image/src/.*\.py$

- repo: local
  hooks:
  - id: check-requirements-pinned
    # Warning-only until the catalog is fully pinned; add --strict to the entry
    # to make it blocking. See docs/aim_conventions.md#dependency-pinning.
    name: "Assets: check specialized image requirements are pinned"
    description: Report dependencies not pinned to an exact version
    entry: python3 -m aim_utils.asset_lint check-requirements-pinned
    language: system
    pass_filenames: true
    always_run: false
    files: ^assets/.*/image/(requirements\.txt|pyproject\.toml)$
    verbose: true

- repo: local
  hooks:
  - id: check-profile-env-vars-no-secrets
    name: "Profiles: reject secret key names in env_vars"
    description: env_vars are hard overrides — never set HF_TOKEN or other secrets here
    entry: python3 -m aim_utils.asset_lint check-profile-env-vars-no-secrets
    language: system
    types: [ yaml ]
    pass_filenames: true
    always_run: false
    files: ^assets/.*/profiles/.*\.yaml$

- repo: local
  hooks:
  - id: check-rocm-canary
    name: "Dockerfile: ROCm torch canary must use sys.exit(), not bare print"
    description: A canary that only prints cannot fail the build; sys.exit() is required
    entry: python3 -m aim_utils.asset_lint check-rocm-canary
    language: system
    pass_filenames: true
    always_run: false
    files: ^assets/.*/image/Dockerfile$
