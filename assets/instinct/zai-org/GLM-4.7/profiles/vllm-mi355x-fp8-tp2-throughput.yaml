aim_id: zai-org/GLM-4.7
model_id: zai-org/GLM-4.7-FP8
metadata:
  accelerator_count: 2
  accelerator_model: MI355X
  accelerator_type: gpu
  engine: vllm
  gpu: MI355X
  gpu_count: 2
  manual_selection_only: false
  metric: throughput
  precision: fp8
  type: optimized
engine_args:
  attention-backend: ROCM_AITER_UNIFIED_ATTN
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  dtype: auto
  enable-auto-tool-choice: null
  enable-expert-parallel: null
  gpu-memory-utilization: 0.9
  kv-cache-dtype: fp8
  max-model-len: -1
  max-num-batched-tokens: 8192
  max-num-seqs: 256
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  reasoning-parser: glm45
  speculative-config:
    method: mtp
    num_speculative_tokens: 1
  tensor-parallel-size: 2
  tool-call-parser: glm47
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  SAFETENSORS_FAST_GPU: '1'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
