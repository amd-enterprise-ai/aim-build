      description:
        full: "GPT-OSS 20B is an open-weight mixture-of-experts (MoE) language model from OpenAI with 21 billion total parameters and 3.6 billion active parameters. The model features configurable reasoning effort across three levels (low, medium, high), full chain-of-thought access, and agentic capabilities including function calling, web browsing, and Python code execution. It supports structured outputs and fine-tuning on consumer hardware. Post-trained with MXFP4 quantization of MoE weights, enabling deployment within 16GB of memory. Designed for lower-latency and local or specialized use cases. Licensed under Apache 2.0."
