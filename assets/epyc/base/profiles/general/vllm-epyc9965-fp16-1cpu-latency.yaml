metadata:
  engine: vllm
  gpu: MI100
  gpu_count: 0
  manual_selection_only: false
  metric: latency
  precision: fp16
  type: preview
engine_args:
  disable-log-requests: true
  dtype: float16
  max-num-batched-tokens: 4096
env_vars:
  OMP_NUM_THREADS: '192'
  VLLM_CPU_KVCACHE_SPACE: '90'
  VLLM_CPU_OMP_THREADS_BIND: auto
  ZENDNNL_LRU_CACHE_CAPACITY: '1024'
  ZENDNNL_MATMUL_ALGO: '1'
  ZENDNN_WEIGHT_CACHING: '1'
  ZENTORCH_LINEAR: '1'
  ZENTORCH_USE_LOCAL_ZENDNN: '1'
