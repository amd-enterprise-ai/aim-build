      release:
        notes: ""
      description:
        full: "Granite 3.3 2B Instruct is a 2 billion parameter 128K context length language model developed by IBM's Granite Team, fine-tuned for improved reasoning and instruction-following capabilities. Built on top of Granite 3.3 2B Base, the model delivers significant gains on benchmarks for measuring generic performance including AlpacaEval 2.0 and Arena-Hard, and improvements in mathematics, coding, and instruction following. Supports structured reasoning through think/response tags, providing clear separation between internal thoughts and final outputs. Trained on a carefully balanced combination of permissively licensed data and curated synthetic tasks, supporting 12 languages including English, German, Spanish, French, Japanese, Portuguese, Arabic, Czech, Italian, Korean, Dutch, and Chinese."
      title: "Granite 3.3 2B Instruct"
