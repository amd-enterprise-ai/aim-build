        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "fp16"
          metric: "latency"
          description: "Optimized for latency on MI355X using fp16 precision"
        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "fp16"
          metric: "throughput"
          description: "Optimized for throughput on MI355X using fp16 precision"
        publisher: "Qwen"
      hfToken:
        required: false
      release:
        notes: ""
      description:
        full: "Qwen3-32B is a 32.8 billion parameter dense causal language model from the Qwen series by the Qwen Team at Alibaba Group. It features 64 layers with Grouped-Query Attention (GQA, 64 Q heads and 8 KV heads). The model supports seamless switching between thinking mode (for complex logical reasoning, math, and coding) and non-thinking mode (for efficient general-purpose dialogue). It provides tool calling and agentic capabilities, supports over 100 languages and dialects, and has a native context length of 32,768 tokens, extendable to 131,072 tokens with YaRN. Trained through pretraining and post-training stages."
      title: "Qwen3 32B"
