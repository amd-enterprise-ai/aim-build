aim_id: meta-llama/Llama-3.2-3B-Instruct
model_id: meta-llama/Llama-3.2-3B-Instruct
metadata:
  accelerator_count: 1
  accelerator_model: MI300X
  accelerator_type: gpu
  engine: vllm
  gpu: MI300X
  gpu_count: 1
  manual_selection_only: false
  metric: latency
  precision: fp16
  primary: false
  type: preview
engine_args:
  disable-uvicorn-access-log: null
  dtype: float16
  gpu-memory-utilization: 0.9
  max-model-len: 32768
  max-num-batched-tokens: 1024
  max-num-seqs: 512
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  swap-space: 64
  tensor-parallel-size: 1
env_vars:
  HSA_NO_SCRATCH_RECLAIM: '1'
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_RMSNORM: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
