      release:
        notes: ""
      description:
        full: "Qwen3-235B-A22B is a 235 billion total parameter mixture-of-experts (MoE) causal language model from the Qwen series by the Qwen Team at Alibaba Group, with 22 billion active parameters per token. It features 94 layers, 128 experts with 8 activated per token, and Grouped-Query Attention (GQA, 64 Q heads and 4 KV heads). The model supports seamless switching between thinking mode (for complex logical reasoning, math, and coding) and non-thinking mode (for efficient general-purpose dialogue). It provides tool calling and agentic capabilities, supports over 100 languages and dialects, and has a native context length of 32,768 tokens, extendable to 131,072 tokens with YaRN. Trained through pretraining and post-training stages."
      title: "Qwen3 235B A22B"
