com:
  amd:
    aim:
      model:
        canonicalName: "zai-org/GLM-4.7-Flash"
        tags:
        - "text-generation"
        - "chat"
        source: "https://huggingface.co/zai-org/GLM-4.7-Flash"
        variants:
        - "zai-org/GLM-4.7-Flash"
        recommendedDeployments:
        - gpuModel: "W7900"
