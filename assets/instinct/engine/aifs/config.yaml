# Engine image: anemoi-inference, ROCm flash-attn, BentoML, the AIFS serving
# code, ten days of ECMWF Open Data input and two perturbed ensemble members
# for four times, on top of the public ROCm PyTorch image.
#
# One image serves AIFS Single 2.0 or AIFS ENS 2.0, one model per process,
# chosen at container start by environment variables:
#   AIFS_VARIANT     single (default) or ens; selects /opt/anemoi/<variant>
#                    (anemoi-models 0.9.3 + anemoi-graphs 0.6.4 for single,
#                    0.11.2 + 0.8.1 for ens).
#   AIFS_CHECKPOINT  checkpoint file; default aifs-single-mse-2.0.ckpt (single)
#                    or aifs-ens-crps-2.0.ckpt (ens).
#   AIFS_HF_REPO     Hugging Face repo for the checkpoint and the model id;
#                    default ecmwf/aifs-single-2.0 or ecmwf/aifs-ens-2.0.
#   AIFS_HF_REVISION Hugging Face commit to read the checkpoint at; defaults
#                    to the validated commit of the default repo.
#
# base_image is what this builds FROM, and mirrors the BASE_IMAGE default in the
# Dockerfile.
base_image:
  registry_host: docker.io
  base_registry_namespace: rocm
  base_repository: pytorch
  base_tag: rocm7.2.4_ubuntu24.04_py3.12_pytorch_release_2.7.1
specialized: true

dockerfile: assets/instinct/engine/aifs/Dockerfile

templates:
  readme: docs/templates/README.md
  deployment: docs/templates/DEPLOYMENT.bentoml.md
# The engine is not an AIM; only the model images built on it are documented.
docs:
  standalone: false
