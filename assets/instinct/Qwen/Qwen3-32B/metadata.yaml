        - gpuModel: "MI300X"
          gpuCount: 1
          precision: "fp16"
          metric: "throughput"
          description: "Optimized for throughput on MI300X using fp16 precision"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "latency"
          description: "Optimized for latency on MI325X using fp16 precision"
          profileId: "vllm-mi325x-fp16-tp1-latency"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "throughput"
          description: "Optimized for throughput on MI325X using fp16 precision"
          profileId: "vllm-mi325x-fp16-tp1-throughput"
        - gpuModel: "MI350X"
          gpuCount: 1
          precision: "fp16"
          metric: "latency"
          description: "Optimized for latency on MI350X using fp16 precision"
        - gpuModel: "MI350X"
          gpuCount: 2
          precision: "fp16"
          metric: "throughput"
