      hfToken:
        required: false
      release:
        notes: ""
      description:
        full: "A 3D nested-hierarchical-transformer (UNesT-Large) segmentation model that parcellates the whole brain into 133 distinct anatomical structures (background + 132 cortical / sub-cortical regions following the Vanderbilt MASI-Lab + Huo-2019 protocol) from T1w MRI. The bundle expects inputs already registered to the MNI305 atlas template (NiftyReg/ANTs); preprocessing inside the AIM is intensity-only (NormalizeIntensityd, nonzero, channel-wise) and a SlidingWindowInferer walks 96^3 patches with overlap 0.7 across the volume. Bundle published mean Dice = 0.71 (per-class mean over 132 foreground regions, measured on a private Vanderbilt + CANDI test split)."
      title: "Whole Brain Segmentation Large UNEST"
