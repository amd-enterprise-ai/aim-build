      release:
        notes: ""
      description:
        full: "Qwen3-VL-235B-A22B-Thinking is the reasoning-enhanced variant of the Qwen3-VL-235B-A22B vision-language model from the Qwen series by the Qwen Team at Alibaba Group, with 236 billion total parameters and approximately 22 billion active parameters per token. It builds on the same architecture as the Instruct variant, featuring Interleaved-MRoPE positional embeddings, DeepStack multi-level ViT feature fusion, and Text-Timestamp Alignment. This Thinking edition adds extended reasoning capabilities for complex logical, mathematical, and coding tasks while retaining all multimodal features: visual agent capabilities, visual coding, advanced spatial perception with 2D and 3D grounding, and OCR for 32 languages. It supports a native 256K token context length, expandable to 1M tokens. Suitable for complex multimodal reasoning, STEM tasks, visual analysis, and agentic visual workflows."
      title: "Qwen3 VL 235B A22B Thinking"
