        notes: ""
      description:
        full: "Command A Reasoning is a 111 billion parameter open-weights language model from Cohere Labs, optimized for tool use, agentic tasks, and multilingual use cases with configurable reasoning capabilities. It uses an optimized transformer architecture with sliding window attention (window size 4096) and RoPE for local context modeling, plus global attention layers without positional embeddings for unrestricted token interactions. The model can operate with reasoning on for increased performance or reasoning off for lower latency. It supports tool use with citation grounding, handles 23 languages. Fine-tuned using supervised fine-tuning (SFT) and preference-based training."
      title: "Command A Reasoning 08 2025"
