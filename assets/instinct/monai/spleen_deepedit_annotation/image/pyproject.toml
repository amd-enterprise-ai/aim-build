[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spleen_deepedit_annotation-aim"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
description = "AIM serving wrapper for the MONAI spleen_deepedit_annotation bundle"
dependencies = [
    "bentoml==1.4.39",
    "pydantic>=2.0,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "service",
    "harness",
    "monai_harness",
    "pipeline",
    "config",
    "constants",
    "schemas",
]
