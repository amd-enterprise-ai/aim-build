# Updated for vLLM 0.16

aim_id: CohereLabs/command-a-reasoning-08-2025
model_id: CohereLabs/command-a-reasoning-08-2025
metadata:
  accelerator_count: 1
  accelerator_model: MI350X
  accelerator_type: gpu
  engine: vllm
  gpu: MI350X
  gpu_count: 1
  manual_selection_only: false
  metric: throughput
  precision: fp16
  primary: true
  type: optimized
engine_args:
  async-scheduling: null
  disable-uvicorn-access-log: null
  dtype: float16
  gpu-memory-utilization: 0.9
  max-model-len: 32768
  max-num-batched-tokens: 1024
  max-num-seqs: 512
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  swap-space: 64
  tensor-parallel-size: 1
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_RMSNORM: '1'
  VLLM_ROCM_USE_AITER_TRITON_FUSED_ROPE_ZEROS_KV_CACHE: '1'
