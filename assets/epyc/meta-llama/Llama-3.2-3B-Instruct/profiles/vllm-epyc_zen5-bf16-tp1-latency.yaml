  accelerator_model: EPYC_ZEN5
  accelerator_type: cpu
  engine: vllm
  manual_selection_only: true
  metric: latency
  precision: bf16
  primary: true
  type: unoptimized
engine_args:
  disable-log-requests: true
  dtype: bfloat16
  max-num-batched-tokens: 2048
env_vars:
