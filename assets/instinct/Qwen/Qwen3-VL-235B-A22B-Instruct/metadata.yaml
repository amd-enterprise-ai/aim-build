      release:
        notes: ""
      description:
        full: "Qwen3-VL-235B-A22B-Instruct is a 236 billion parameter mixture-of-experts (MoE) vision-language model from the Qwen series by the Qwen Team at Alibaba Group, with approximately 22 billion active parameters per token. It features Interleaved-MRoPE positional embeddings for long-horizon video reasoning, DeepStack multi-level ViT feature fusion for fine-grained image-text alignment, and Text-Timestamp Alignment for precise video temporal modeling. The model supports visual agent capabilities for operating PC and mobile GUIs, visual coding (generating Draw.io, HTML, CSS, and JS from images), advanced spatial perception including 2D and 3D grounding, and OCR for 32 languages. It handles a native 256K token context length, expandable to 1M tokens. Suitable for multimodal dialogue, visual reasoning, document understanding, and agentic visual tasks."
      title: "Qwen3 VL 235B A22B Instruct"
