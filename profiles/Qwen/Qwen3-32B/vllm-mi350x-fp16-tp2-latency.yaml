aim_id: Qwen/Qwen3-32B
model_id: Qwen/Qwen3-32B
metadata:
  engine: vllm
  gpu: MI350X
  gpu_count: 2
  manual_selection_only: true
  metric: latency
  precision: fp16
  type: unoptimized
engine_args:
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  max-model-len: 32768
  max-num-batched-tokens: 1024
  max-num-seqs: 512
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  reasoning-parser: qwen3
  swap-space: 16
  tensor-parallel-size: 2
  tool-call-parser: hermes
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_TRITON_ROPE: '1'
