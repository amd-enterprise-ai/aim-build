org:
  opencontainers:
    image:
      vendor: "AMD"
      authors: ""
      licenses: "Apache-2.0, MIT"
      description: "Open-weight 117B parameter MoE model with 5.1B active parameters and configurable reasoning."
      documentation: ""
      source: "https://github.com/amd-enterprise-ai/aim-build"
com:
  amd:
    aim:
      model:
        canonicalName: "openai/gpt-oss-120b"
        tags:
        - "text-generation"
        - "conversational"
        - "chat"
        source: "https://huggingface.co/openai/gpt-oss-120b"
        variants:
        - "openai/gpt-oss-120b"
        recommendedDeployments:
        - gpuModel: "MI250X"
          gpuCount: 2
          metric: "latency"
          description: "Optimized for latency on MI250X using fp4 precision"
          profileId: "vllm-mi250x-mxfp4-tp2-latency"
        - gpuModel: "MI250X"
          gpuCount: 2
          metric: "throughput"
          description: "Optimized for throughput on MI250X using fp4 precision"
          profileId: "vllm-mi250x-mxfp4-tp2-throughput"
        - gpuModel: "MI300X"
          gpuCount: 1
          precision: "fp4"
          metric: "latency"
          description: "Optimized for latency on MI300X using fp4 precision"
        - gpuModel: "MI300X"
          gpuCount: 1
          precision: "fp4"
          metric: "throughput"
          description: "Optimized for throughput on MI300X using fp4 precision"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "latency"
          description: "Optimized for latency on MI325X using fp4 precision"
          profileId: "vllm-mi325x-mxfp4-tp1-latency"
        - gpuModel: "MI325X"
          gpuCount: 1
          metric: "throughput"
          description: "Optimized for throughput on MI325X using fp4 precision"
          profileId: "vllm-mi325x-mxfp4-tp1-throughput"
        - gpuModel: "MI350X"
          gpuCount: 1
          precision: "fp4"
          metric: "latency"
          description: "Optimized for latency on MI350X using fp4 precision"
        - gpuModel: "MI350X"
          gpuCount: 1
          precision: "fp4"
          metric: "throughput"
          description: "Optimized for throughput on MI350X using fp4 precision"
        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "fp4"
          metric: "latency"
          description: "Optimized for latency on MI355X using fp4 precision"
        - gpuModel: "MI355X"
          gpuCount: 1
          precision: "fp4"
          metric: "throughput"
          description: "Optimized for throughput on MI355X using fp4 precision"
        publisher: "OpenAI"
      hfToken:
        required: false
      release:
        notes: ""
      description:
        full: "GPT-OSS 120B is an open-weight mixture-of-experts (MoE) language model from OpenAI with 117 billion total parameters and 5.1 billion active parameters. The model features configurable reasoning effort across three levels (low, medium, high), full chain-of-thought access, and agentic capabilities including function calling, web browsing, and Python code execution. It supports structured outputs and fine-tuning. Post-trained with MXFP4 quantization of MoE weights, enabling deployment on a single 80GB GPU. Licensed under Apache 2.0."
      title: "GPT OSS 120B"
