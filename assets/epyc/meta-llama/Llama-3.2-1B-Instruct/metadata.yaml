com:
  amd:
    aim:
      model:
        canonicalName: "meta-llama/Llama-3.2-1B-Instruct"
        tags:
        - "text-generation"
        - "chat"
        - "instruction"
        source: "https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct"
        variants:
        - "meta-llama/Llama-3.2-1B-Instruct"
        publisher: "Meta"
      hfToken:
        required: true
      release:
        notes: ""
      description:
        full: "Llama 3.2 1B Instruct is part of the Meta Llama 3.2 collection of multilingual large language models, available in 1B and 3B sizes. It is a 1.24 billion parameter auto-regressive language model using an optimized transformer architecture with Grouped-Query Attention (GQA) and shared embeddings. The model incorporates knowledge distillation from Llama 3.1 8B and 70B models during pretraining, with pruning applied to recover performance. The instruction-tuned version uses supervised fine-tuning (SFT), rejection sampling (RS), and direct preference optimization (DPO) for alignment. It supports multilingual dialogue across 8 languages (English, German, French, Italian, Portuguese, Hindi, Spanish, and Thai) with a 128k token context length. Pre-trained on up to 9 trillion tokens with a knowledge cutoff of December 2023. Intended for assistant-like chat, agentic retrieval, summarization, and on-device applications."
      title: "Llama 3.2 1B Instruct"
