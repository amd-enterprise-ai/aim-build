aim_id: Qwen/Qwen3-235B-A22B
model_id: Qwen/Qwen3-235B-A22B-FP8
metadata:
  engine: vllm
  gpu: MI355X
  gpu_count: 4
  manual_selection_only: true
  metric: throughput
  precision: fp8
  type: unoptimized
engine_args:
  disable-uvicorn-access-log: null
  distributed_executor_backend: mp
  dtype: auto
  enable-auto-tool-choice: null
  gpu-memory-utilization: 0.9
  kv-cache-dtype: auto
  max-model-len: 32768
  max-num-batched-tokens: 2048
  max-num-seqs: 512
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  reasoning-parser: qwen3
  swap-space: 16
  tensor-parallel-size: 4
  tool-call-parser: hermes
env_vars:
  HSA_NO_SCRATCH_RECLAIM: '1'
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_ROCM_USE_AITER: '0'
  VLLM_V1_USE_PREFILL_DECODE_ATTENTION: '1'
