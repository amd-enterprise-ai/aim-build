# The CI passes the profile's engine_args (nsteps: -2, nstlist: 200, ntmpi: 1) as AIM_ENGINE_ARGS.
# A case value overrides the profile key by key (docs/engine-args-override.md), so this bounds the run to a few steps
# and keeps nstlist and ntmpi.
AIM_ENGINE_ARGS: '{"nsteps": 500}'
