# Run-to-completion check, case "broken": target.pdb is not a structure, so the image must exit non-zero through its
# own input validation and still leave bindcraft.log under AIM_OUTPUT_PATH. Check-only mode keeps the run short even
# if the validation ever let the input through.
AIM_FBC_PREFLIGHT_ONLY: "1"
