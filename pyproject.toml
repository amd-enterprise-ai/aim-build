[project]
name = "aim-build"
version = "0.12"
description = "AMD Inference Microservice - Container build and configuration tools"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "AMD" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
]
# Core dependencies (aim_runtime)
dependencies = [
    "click>=8.4.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pydantic>=2.13.3,<3.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
# Dependencies for running tests
test = [
    "pytest-cov>=7.1.0",
    "pytest==9.0.3",
    "pytest-mock>=3.14.0",
    "coverage",
    "pytest-html",
    "pytest-json-report"
]

# Lightweight CI dependencies (version resolution, registry queries, change detection)
ci = [
    "requests>=2.34.2",
    "semver>=3,<4",
    "tomli>=2.4.1",
]

# Database dependencies (validation result caching and recording)
db = [
    "psycopg[binary]>=3.3.4",
    "sqlmodel>=0.0.38",
]

# Dependencies for development (CI, pre-commit hooks, linting, running utils, etc.)
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "jinja2>=3.1.6",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest==9.0.3",
    "pytest-mock>=3.14.0",
    # Added for development scripts and tests that require HTTP requests.
    "requests>=2.34.2",
    "semver>=3,<4",
    "tomli>=2.4.1",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "pydantic==2.13.4",
    # PostgreSQL adapter for validation database and pgcli
    "psycopg[binary]>=3.3.4",
    "sqlmodel>=0.0.38",
    # CLI tool for interactive database exploration
    "pgcli>=4.0.0",
    # vRAM estimation tool dependency
    "hf-mem>=0.5.5"
]

# Dependencies for accuracy evaluation and model validation
evaluation = [
    "transformers>=4.57.6",
    "lm-eval[api]>=0.4.12",
    "hf_transfer>=0.1.9"
]

[project.urls]
Homepage = "https://github.com/amd-enterprise-ai/aim-build"

[project.scripts]
aim-runtime = "entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["aim_runtime", "aim_runtime.harness", "aim_common", "aim_utils"]
py-modules = ["entrypoint"]

[tool.setuptools.package-data]
aim_runtime = ["benchmark-config.yaml"]

[tool.black]
target-version = ['py312']
line-length = 120

[tool.isort]
profile = "black"
py_version = 312
line_length = 120
known_first_party = ["aim_runtime"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
warn_unused_configs = true
ignore_missing_imports = true
strict = false
pretty = true
show_column_numbers = true
no_implicit_optional = false
explicit_package_bases = true
scripts_are_modules = true
check_untyped_defs = false
exclude = ["tests/", "docker/"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not integration",  # Exclude integration tests by default
    "--cov",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (requires GPU environment, run with '-m integration')",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
[tool.coverage.run]
source = [
    "src/aim_runtime",
    "src/aim_common",
    "src/aim_utils",
    "ci/utils",
    "entrypoint",
]
omit = [
    "*/site-packages/*",
    "*/dist-packages/*",
]
