# Engine definitions for AIM runtime.
#
# Adding a new engine: add an entry here with launch command and model argument.
#
# Fields:
#   launch:             Command prefix (split by spaces for argv).
#                       "python" auto-resolves to python/python3.
#   model_arg:          (optional) CLI flag for the model path (e.g. --model, -m).
#                       Omit or set to "" for engines that embed the model in launch.
#   validator:          (optional) Registered Python validator name for native
#                       engine arg validation. Omit for no native validation.
#   args_format:        (optional) Override how engine_args are serialized on the CLI.
#                       Normally inferred from the engine type; set explicitly only to
#                       override the default.
#                       "standard" (default): --key value
#                       "forwarded":          --arg key=value

vllm:
  launch: python -m vllm.entrypoints.openai.api_server
  model_arg: --model
  validator: vllm

