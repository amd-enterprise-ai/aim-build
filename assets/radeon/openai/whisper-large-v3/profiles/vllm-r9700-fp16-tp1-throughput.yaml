aim_id: openai/whisper-large-v3
model_id: openai/whisper-large-v3
metadata:
  accelerator_count: 1
  accelerator_model: R9700
  accelerator_type: gpu
  engine: vllm
  metric: throughput
  precision: fp16
  primary: true
  type: optimized
engine_args:
  async-scheduling: null
  attention-config:
    backend_per_kind:
      full_attention: ROCM_AITER_UNIFIED_ATTN
      cross_attention: ROCM_AITER_UNIFIED_ATTN
  dtype: float16
  gpu-memory-utilization: 0.9
  max-model-len: 448
  tensor-parallel-size: 1
  trust-remote-code: null
env_vars:
  FLASH_ATTENTION_TRITON_AMD_ENABLE: 'TRUE'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: '1'
  VLLM_DO_NOT_TRACK: '1'
  VLLM_WORKER_MULTIPROC_METHOD: spawn
