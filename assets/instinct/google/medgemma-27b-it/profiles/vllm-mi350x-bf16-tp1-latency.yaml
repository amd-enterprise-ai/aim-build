aim_id: google/medgemma-27b-it
model_id: google/medgemma-27b-it
metadata:
  engine: vllm
  gpu: MI350X
  gpu_count: 1
  manual_selection_only: false
  metric: latency
  precision: bf16
  primary: true
  type: optimized
engine_args:
  disable-uvicorn-access-log: null
  dtype: bfloat16
  gpu-memory-utilization: 0.95
  max-model-len: -1
  no-async-scheduling: null
  no-enable-log-requests: null
  no-enable-prefix-caching: null
  no-trust-remote-code: null
  tensor-parallel-size: 1
env_vars:
  NCCL_MIN_NCHANNELS: '112'
  TORCH_BLAS_PREFER_HIPBLASLT: '1'
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  VLLM_ROCM_USE_AITER: '1'
  VLLM_ROCM_USE_AITER_MHA: '1'
  VLLM_ROCM_USE_AITER_RMSNORM: '1'
